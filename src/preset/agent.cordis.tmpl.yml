# The `tool-creator` agent preset: a THIN stage-stepper conductor over the
# dsh-pipeline-executor, which runs the five-role artifact pipeline
# (composer → guidance → engineer → zipper → battery) from a declarative
# manifest with per-role confinement.
#
# GENERATED FILE — the source of truth is src/ in the dsh-tool-creator repo; the
# charter text is injected at build time from src/preset/charter.md. Edit the
# source, run build.mjs, reinstall. Hand-edits here are overwritten.
#
# This file is an AGENT-PLANE composition. The host composition keeps
# everything a preset must not own: the registries, the sandbox and approval
# stack, persistence, and the model route. A service row here MUST sit inside
# a group carrying an `isolate` realm (host rejects root-realm leaks at mount).
#
# Row policy relative to the shipped `standard` preset:
#   kept      — persona (rewritten), shell, filesystem, compaction, delegation
#               (reshaped around the executor).
#   excluded  — tool-goal, plan-mode, agent-instructions, tool-ask-user,
#               tool-todo, tool-ralph: a deterministic stage stepper carries
#               no discretionary state. tool-skill/skill-filesystem: omitted
#               (L2 decision, 2026-08-17 — see the preset-local skills note
#               at the end of this file).

# ── identity ────────────────────────────────────────────────────────────────

# `complete: true` makes this charter the ONLY system prompt: tool-guidance
# sections and runtime snapshots are suppressed; tool descriptions still
# travel in the schemas. The conductor's whole world is the charter.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    includeRuntimeContext: false
    text: |-
{{CHARTER_INDENTED}}

# ── shell + filesystem (the conductor's minimal hands) ─────────────────────

# The conductor needs: `read` (nothing today — reserved for gate-log reading
# on STOP reports), and bash ONLY as an emergency escape the charter forbids
# in normal operation. L2 revisits whether bash can be dropped once the
# executor also serves gate logs.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ── context survival ───────────────────────────────────────────────────────

# Unlike the predecessor preset, tool-creator keeps compaction: a five-stage run
# with retries is a long session, and the executor's small returns do not
# guarantee the window never fills (E2 measures; if provably unnecessary the
# rows drop in L7, not before).
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  # Row names mirror the shipped cordis preset exactly: `dsh-compaction` is a
  # LIBRARY package with no `/pruner` export — a row naming it fails at boot
  # (fixed at L2; the plugins are dsh-compaction-basic and
  # dsh-compaction-tool-result-pruner).
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# ── the executor (the preset's reason to exist) ────────────────────────────

# dsh-pipeline-executor dispatches confined role subagents from the pipeline
# manifest, runs gates, and writes the evidence ledger. It consumes the
# host-plane `subagents` registry (the same seam tool-subagent rows use) and
# provides no service of its own — no realm needed. The manifest path is
# preset-dir-relative and travels with the copy: `baseDir` is computed from
# this composition file's own `baseUrl`, the same `!!js` convention the
# shipped cordis preset uses for its skills/ directory.
- id: pipeline-executor
  name: 'dsh-pipeline-executor'
  config:
    baseDir: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('.', baseUrl))"
    manifestPath: manifest/pipeline.manifest.json

# ── preset-local skills: OMITTED (L2 decision, 2026-08-17) ─────────────────

# DECISION D5 plans preset-local skills (cordis convention: skill-filesystem
# customSkillDirs + baseUrl, plus tool-skill) to carry role-agnostic public
# doctrine. No file ships under skills/ yet, so mounting both rows today
# would register an EMPTY catalog — schema noise in every conductor turn for
# zero capability. Add both rows back in the SAME commit that adds the first
# skills/ file, and disable the default skill roots when doing so (the
# global-root leak class is real — see dsh-plugin-hazards).
